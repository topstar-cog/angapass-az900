<script>
const D={1:["Cloud concepts",27.5],2:["Architecture & services",37.5],3:["Management & governance",32.5]};
// d=domain, t=topic, o=options, a=correct option indexes, e=explanation
const Q=[
{d:1,t:"Consumption model",q:"A Nairobi sacco buys its own servers for a new datacenter. Which type of expenditure is this?",o:["Capital expenditure (CapEx)","Operational expenditure (OpEx)","Consumption-based","Subscription"],a:[0],e:"Up-front purchase of physical assets is CapEx. Pay-as-you-go cloud spending is OpEx."},
{d:1,t:"Scalability",q:"A Lagos online shop automatically adds virtual machines during a flash sale and removes them afterwards. Which benefit is this?",o:["Elasticity","Governance","Predictability","Sovereignty"],a:[0],e:"Elasticity means resources grow and shrink automatically with demand."},
{d:1,t:"Scalability",q:"An administrator adds more RAM to an existing virtual machine. What is this called?",o:["Scaling out","Scaling up (vertical scaling)","Geo-redundancy","Load balancing"],a:[1],e:"Adding capacity to one machine is scaling up. Adding more machines is scaling out."},
{d:1,t:"Shared responsibility",q:"Which TWO responsibilities always stay with the customer, whether using IaaS, PaaS or SaaS?",o:["Information and data","Accounts and identities","Physical hosts","Datacenter power"],a:[0,1],e:"Data, accounts/identities and the devices you allow to connect are always yours. Physical hosts and power belong to the provider."},
{d:1,t:"Shared responsibility",q:"Who patches the guest operating system of an IaaS virtual machine?",o:["Microsoft","The customer","The datacenter team","The internet provider"],a:[1],e:"In IaaS you manage the OS. In PaaS this shifts to the provider."},
{d:1,t:"Cloud models",q:"A hospital keeps patient records in its own datacenter but hosts its public website in Azure. Which cloud model is this?",o:["Public","Private","Hybrid","Community"],a:[2],e:"Combining on-premises resources with public cloud is a hybrid model."},
{d:1,t:"Service types",q:"A Kigali clinic uses hosted email and office apps. The provider runs everything; the clinic manages only its users and data. Which service type is this?",o:["IaaS","PaaS","SaaS","Serverless"],a:[2],e:"SaaS delivers a finished application. The customer manages only data, users and settings."},
{d:1,t:"Serverless",q:"Developers want code to run only when an event happens, pay only while it runs, and manage no servers. Which model fits?",o:["Serverless","Dedicated hosting","Private cloud","On-premises"],a:[0],e:"Serverless (for example Azure Functions) runs event-driven code with no server management and per-execution billing."},
{d:2,t:"Regions & zones",q:"You need to keep an app running if one datacenter in a region fails. Which feature helps?",o:["Availability zones","Resource locks","Tags","Azure Advisor"],a:[0],e:"Availability zones are physically separate datacenters within a region."},
{d:2,t:"Regions & zones",q:"Which statement best describes an Azure region pair?",o:["Two regions in the same geography used for resilience and recovery","Two datacenters in one building","Two subscriptions with shared billing","Two virtual networks that are peered"],a:[0],e:"Region pairs are two regions in one geography that support disaster recovery."},
{d:2,t:"Hierarchy",q:"Which order is correct, from the top level down?",o:["Management group, subscription, resource group, resource","Subscription, management group, resource, resource group","Resource group, subscription, management group, resource","Resource, resource group, subscription, management group"],a:[0],e:"Management groups contain subscriptions, which contain resource groups, which contain resources."},
{d:2,t:"Resource groups",q:"Which statement about resource groups is true?",o:["Each resource belongs to exactly one resource group","A resource can sit in two groups at once","Resource groups can be nested","Deleting a group keeps its resources"],a:[0],e:"A resource lives in exactly one resource group. Deleting the group deletes what is inside it."},
{d:2,t:"Compute",q:"Which compute option packages an app with its dependencies and shares the host operating system?",o:["Containers","Dedicated VMs","Availability sets","Data Box"],a:[0],e:"Containers are lightweight and share the host OS kernel, unlike VMs which carry a full OS."},
{d:2,t:"Storage",q:"You want the cheapest redundancy option that keeps three copies of data inside a single datacenter. Which one?",o:["Locally redundant storage (LRS)","Zone-redundant storage (ZRS)","Geo-redundant storage (GRS)","Read-access GRS"],a:[0],e:"LRS keeps three copies in one datacenter. ZRS spreads across zones; GRS adds another region."},
{d:2,t:"Storage",q:"Data must be kept for years, is almost never read, and can wait hours to retrieve. Which access tier fits best?",o:["Hot","Cool","Archive","Premium"],a:[2],e:"Archive is the cheapest to store and slowest to retrieve."},
{d:2,t:"Identity",q:"Which Azure service provides cloud identity management with single sign-on and multifactor authentication?",o:["Microsoft Entra ID","Azure Policy","Azure Monitor","Azure Arc"],a:[0],e:"Microsoft Entra ID is the cloud identity and access service."},
{d:2,t:"Networking",q:"A bank wants a private, dedicated connection to Azure that does not cross the public internet. Which service fits?",o:["Azure ExpressRoute","VPN Gateway","Azure DNS","Application Insights"],a:[0],e:"ExpressRoute is a private dedicated link. VPN Gateway sends encrypted traffic over the public internet."},
{d:2,t:"Security",q:"Which security idea says: never trust, always verify every request?",o:["Zero Trust","Defense in depth","Shared responsibility","Elasticity"],a:[0],e:"Zero Trust assumes no request is safe by default and verifies explicitly. (Outline-based question.)"},
{d:3,t:"Cost",q:"A startup wants to estimate the monthly cost of a planned Azure deployment before building it. Which tool?",o:["Pricing calculator","Azure Policy","Resource locks","Azure Service Health"],a:[0],e:"The pricing calculator estimates costs of services you plan to use."},
{d:3,t:"Cost",q:"Finance wants costs grouped by department across many resource groups. What should be applied to resources?",o:["Tags","Locks","Availability zones","Management ports"],a:[0],e:"Tags are name/value labels that let you group and report costs."},
{d:3,t:"Governance",q:"You must stop anyone from accidentally deleting a production database. What should you use?",o:["A resource lock","A tag","Azure Advisor","A pricing tier"],a:[0],e:"A CanNotDelete lock blocks deletion even for authorised users."},
{d:3,t:"Governance",q:"A company requires that all new resources are created only in approved regions. Which service enforces this?",o:["Azure Policy","Azure Monitor","Azure Cloud Shell","Pricing calculator"],a:[0],e:"Azure Policy defines rules and checks resources against them."},
{d:3,t:"Monitoring",q:"You want an automatic notification when a VM's CPU stays above 90%. Which feature?",o:["Azure Monitor alerts","Azure Policy","Tags","Azure Migrate"],a:[0],e:"Azure Monitor collects metrics and can trigger alerts."},
{d:3,t:"Monitoring",q:"Which service gives personalised recommendations to improve cost, security, reliability and performance?",o:["Azure Advisor","Azure Service Health","Azure Arc","Azure DNS"],a:[0],e:"Advisor recommends improvements. Service Health reports Azure issues that affect you."},
{d:3,t:"Management",q:"A company wants to manage its on-premises servers and other clouds from the Azure portal. Which service helps?",o:["Azure Arc","Azure Virtual Desktop","Azure Data Box","Azure Advisor"],a:[0],e:"Azure Arc extends Azure management to resources outside Azure."},
{d:1,t:"Service types",q:"Developers deploy a web app without managing the operating system or servers, but they control the app code and data. Which service type is this?",o:["PaaS","IaaS","SaaS","On-premises"],a:[0],e:"PaaS gives you a managed platform. You manage the app and data; the provider manages OS and infrastructure."},
{d:1,t:"Cloud models",q:"A Ghanaian startup rents services from a provider's datacenters over the internet and buys no hardware. Which cloud model is this?",o:["Public cloud","Private cloud","Hybrid cloud","Legacy hosting"],a:[0],e:"Public cloud resources are owned and run by the provider and shared across many customers."},
{d:1,t:"Cloud models",q:"A company runs analytics in Azure and file storage with a different cloud provider. What is this approach called?",o:["Multicloud","Private cloud","Single-tenant","On-premises"],a:[0],e:"Using services from more than one cloud provider is multicloud."},
{d:1,t:"Cloud benefits",q:"Which cloud benefit means a system keeps working and can recover quickly when something fails?",o:["Reliability","Elasticity","CapEx","Governance"],a:[0],e:"Reliability is the ability to recover from failures and keep running."},
{d:1,t:"Cloud benefits",q:"A finance team can forecast Azure performance and costs ahead of time. Which benefit is this?",o:["Predictability","Elasticity","Sovereignty","Sustainability"],a:[0],e:"Predictability covers both performance and cost forecasting."},
{d:1,t:"Consumption model",q:"Which statement describes the consumption-based model?",o:["You pay only for the resources you use","You pay a fixed fee whatever you use","You buy all hardware up front","You pay once a year in advance"],a:[0],e:"Consumption-based means no up-front cost and billing by actual use."},
{d:2,t:"Compute",q:"You need the number of identical VMs to grow and shrink automatically with load. Which feature?",o:["Virtual machine scale sets","Availability sets","Resource locks","Azure Data Box"],a:[0],e:"Scale sets create and manage a group of load-balanced identical VMs that scale automatically."},
{d:2,t:"Compute",q:"Which option spreads VMs across fault domains and update domains inside a datacenter?",o:["Availability sets","Scale sets","Region pairs","Management groups"],a:[0],e:"Availability sets protect against hardware failure and planned maintenance within one datacenter."},
{d:2,t:"Compute",q:"A team wants to host a web app and its API without managing servers. Which service fits best?",o:["Azure App Service","Azure Arc","Azure Advisor","Azure DNS"],a:[0],e:"App Service is a PaaS offering for web apps and APIs."},
{d:2,t:"Compute",q:"Staff need to reach a Windows desktop hosted in Azure from any device. Which service provides this?",o:["Azure Virtual Desktop","Azure Functions","Azure Policy","Azure Backup"],a:[0],e:"Azure Virtual Desktop delivers cloud-hosted desktops and apps."},
{d:2,t:"Networking",q:"Which service lets Azure resources communicate with each other privately and securely?",o:["Azure Virtual Network","Azure Monitor","Azure Advisor","Azure Blob Storage"],a:[0],e:"A virtual network is your private network in Azure."},
{d:2,t:"Networking",q:"A company needs an encrypted connection between its office network and Azure over the public internet. Which service?",o:["VPN Gateway","ExpressRoute","Azure DNS","Azure Policy"],a:[0],e:"VPN Gateway uses encrypted tunnels over the internet. ExpressRoute is a private link."},
{d:2,t:"Storage",q:"A photo app must store millions of images and videos as unstructured data. Which service fits?",o:["Azure Blob Storage","Azure Queue Storage","Azure Virtual Desktop","Azure Arc"],a:[0],e:"Blob Storage is designed for massive amounts of unstructured data."},
{d:2,t:"Identity",q:"A junior admin must manage virtual machines in only one resource group. What should you use?",o:["Azure role-based access control (RBAC)","A resource lock","A tag","Azure Advisor"],a:[0],e:"RBAC assigns roles at a chosen scope, giving least-privilege access."},
{d:2,t:"Identity",q:"You want to require multifactor authentication when someone signs in from an unfamiliar location. What should you use?",o:["Conditional Access","Azure Policy","Pricing calculator","Availability zones"],a:[0],e:"Conditional Access applies access rules based on conditions like location or device."},
{d:2,t:"Security",q:"Which approach protects data using several layers of security, so one failure does not expose everything?",o:["Defense in depth","Elasticity","Scaling out","Consumption model"],a:[0],e:"Defense in depth layers physical, identity, perimeter, network, compute, application and data protection."},
{d:2,t:"Security",q:"Which service provides security posture management and threat protection for Azure and hybrid workloads?",o:["Microsoft Defender for Cloud","Azure Advisor","Azure Cloud Shell","Azure Policy"],a:[0],e:"Defender for Cloud assesses security posture and detects threats. (Outline-based question.)"},
{d:3,t:"Cost",q:"Which TWO factors can change what you pay for Azure resources?",o:["Resource type and size","Region where it is deployed","The colour theme of your portal","Your browser"],a:[0,1],e:"Resource type, size, region, usage and bandwidth all affect cost."},
{d:3,t:"Cost",q:"A company will run the same VMs steadily for three years and wants a large discount in return for the commitment. What fits?",o:["Azure Reservations","Azure Spot VMs","Resource locks","Tags"],a:[0],e:"Reservations give discounts for committing to one or three years."},
{d:3,t:"Cost",q:"A data team runs interruptible batch jobs and wants the lowest price using spare Azure capacity. What fits?",o:["Azure Spot VMs","Reserved instances","Dedicated hosts","Availability sets"],a:[0],e:"Spot VMs are cheap but Azure can evict them when it needs the capacity back."},
{d:3,t:"Cost",q:"A company wants to reuse its existing Windows Server licences (with Software Assurance) to cut Azure costs. What fits?",o:["Azure Hybrid Benefit","Pricing calculator","Azure Advisor","Management groups"],a:[0],e:"Hybrid Benefit lets you use eligible on-premises licences in Azure."},
{d:3,t:"Cost",q:"Which service shows what you are spending and lets you set budgets and alerts?",o:["Microsoft Cost Management","Azure Service Health","Azure Arc","Azure DNS"],a:[0],e:"Cost Management analyses spending and supports budgets and alerts."},
{d:3,t:"Monitoring",q:"You want to be told when an Azure outage affects the services you actually use. What should you check?",o:["Azure Service Health","Azure Advisor","Pricing calculator","Azure Cloud Shell"],a:[0],e:"Service Health reports incidents and planned maintenance that affect your resources."},
{d:3,t:"Management",q:"An admin wants a browser-based command line for Azure with nothing to install. Which tool?",o:["Azure Cloud Shell","Azure Data Box","Azure Migrate","Azure Backup"],a:[0],e:"Cloud Shell offers Bash or PowerShell in the browser."},
{d:3,t:"Management",q:"A team wants to redeploy the same set of resources repeatedly from a declarative file. What approach is this?",o:["Infrastructure as code (ARM templates)","Manual portal clicks","Resource locks","Tagging"],a:[0],e:"ARM templates describe resources declaratively so deployments are repeatable."},
{d:3,t:"Governance",q:"Which service helps you discover and classify data across on-premises, multicloud and SaaS sources?",o:["Microsoft Purview","Azure Monitor","Azure DNS","Azure Virtual Desktop"],a:[0],e:"Purview provides data governance, discovery and classification. (Outline-based question.)"},
{d:1,t:"Cloud benefits",q:"An app must stay reachable with minimal downtime even when components fail. Which concept is this?",o:["High availability","Elasticity","CapEx","Data sovereignty"],a:[0],e:"High availability keeps workloads accessible despite failures."},
{d:1,t:"Cloud benefits",q:"A Kampala firm replicates its systems to another region so it can restore service after a major outage. Which cloud benefit is this?",o:["Disaster recovery","Scaling up","Consumption pricing","Tagging"],a:[0],e:"Replicating to another region supports disaster recovery."},
{d:1,t:"Cloud benefits",q:"A company wants to enforce standards and compliance rules across all its cloud resources. Which benefit area is this?",o:["Governance","Elasticity","Latency","Scalability"],a:[0],e:"Governance covers policies, compliance and standards."},
{d:1,t:"Cloud models",q:"A bank runs a cloud used only by its own organisation, in its own datacenter. Which model is this?",o:["Private cloud","Public cloud","Multicloud","Community cloud"],a:[0],e:"A private cloud is used exclusively by one organisation."},
{d:1,t:"Service types",q:"Which service type gives the customer the MOST control over the operating system?",o:["IaaS","PaaS","SaaS","Serverless"],a:[0],e:"With IaaS you manage the OS, runtime and apps; the provider manages hardware."},
{d:1,t:"Service types",q:"Which of these is an example of SaaS?",o:["Microsoft 365","Azure Virtual Machines","Azure Virtual Network","Azure Kubernetes Service"],a:[0],e:"Microsoft 365 is a finished application delivered as a service."},
{d:2,t:"Regions & zones",q:"A government requires that data stays inside its country's borders. Which Azure concept helps?",o:["Azure geographies","Tags","Scale sets","Spot VMs"],a:[0],e:"Geographies keep data within a data-residency boundary."},
{d:2,t:"Hierarchy",q:"Which service is the deployment and management layer for all Azure resources?",o:["Azure Resource Manager","Azure Monitor","Azure DNS","Azure Backup"],a:[0],e:"Every portal, CLI and template action goes through Azure Resource Manager."},
{d:2,t:"Hierarchy",q:"Which Azure construct acts as a billing boundary and an access-management boundary?",o:["Subscription","Tag","Availability zone","Region pair"],a:[0],e:"Subscriptions group resources, billing and access."},
{d:2,t:"Hierarchy",q:"You want to apply the same policy across several subscriptions. What should you use?",o:["Management groups","Resource locks","Tags","Availability sets"],a:[0],e:"Management groups organise subscriptions so policies apply to all beneath them."},
{d:2,t:"Compute",q:"A small piece of code must run when an HTTP request arrives, billed per execution. Which service fits?",o:["Azure Functions","Azure Virtual Desktop","Azure VPN Gateway","Azure Files"],a:[0],e:"Azure Functions is event-driven serverless compute."},
{d:2,t:"Networking",q:"You need two virtual networks to communicate privately over the Microsoft backbone. What do you configure?",o:["Virtual network peering","Azure DNS","Resource locks","Reserved instances"],a:[0],e:"Peering connects virtual networks with low latency over Microsoft's network."},
{d:2,t:"Storage",q:"Teams need shared file shares in the cloud accessible over SMB. Which service fits?",o:["Azure Files","Azure Blob Storage","Azure Queue Storage","Azure Spot VMs"],a:[0],e:"Azure Files provides managed SMB (and NFS) file shares."},
{d:2,t:"Identity",q:"Which capability lets users sign in once and access many applications?",o:["Single sign-on (SSO)","Defense in depth","Elasticity","Peering"],a:[0],e:"SSO uses one set of credentials for multiple apps."},
{d:2,t:"Identity",q:"Which authentication approach combines something you know with something you have?",o:["Multifactor authentication","Single-factor sign-in","Resource locking","Geo-redundancy"],a:[0],e:"MFA requires two or more kinds of proof, such as a password and a phone code."},
{d:3,t:"Governance",q:"Which statement is correct?",o:["Azure Policy controls what resources can be created; RBAC controls what users can do","RBAC controls resource properties; Policy controls users","They do exactly the same thing","Neither applies at subscription level"],a:[0],e:"Policy governs resources; RBAC governs user actions."},
{d:3,t:"Governance",q:"What does a ReadOnly resource lock prevent?",o:["Modifying and deleting the resource","Only deleting it","Only viewing it","Nothing"],a:[0],e:"ReadOnly blocks changes and deletion. CanNotDelete blocks only deletion."},
{d:3,t:"Governance",q:"What is a group of related Azure Policy definitions assigned together called?",o:["An initiative","A tag set","A scale set","A blueprint lock"],a:[0],e:"A policy initiative bundles definitions to achieve one larger goal."},
{d:3,t:"Management",q:"Which command-line tool runs on Windows, macOS and Linux to manage Azure?",o:["Azure CLI","Azure Advisor","Azure Data Box","Azure Spot"],a:[0],e:"Azure CLI is cross-platform. Azure PowerShell also runs cross-platform."},
{d:3,t:"Management",q:"Which Azure tool is a web-based graphical interface for managing resources?",o:["Azure portal","Azure CLI","ARM template","Azure Policy"],a:[0],e:"The Azure portal is the browser-based GUI."},
{d:3,t:"Management",q:"Which tool lets admins manage Azure by running cmdlets?",o:["Azure PowerShell","Azure Files","Azure DNS","Azure Peering"],a:[0],e:"Azure PowerShell offers cmdlets for managing Azure."},
{d:3,t:"Monitoring",q:"Which feature monitors the performance of a web application and detects failures?",o:["Application Insights","Azure Policy","Azure Reservations","Azure Arc"],a:[0],e:"Application Insights is Azure Monitor's application performance monitoring."},
{d:3,t:"SLAs",q:"What does a service level agreement (SLA) define?",o:["Uptime and connectivity commitments from the provider","The price of reserved instances","The location of regions","User passwords"],a:[0],e:"An SLA states guaranteed availability, usually as a percentage."},
{d:3,t:"SLAs",q:"You combine two services that each have a 99.9% SLA in one solution. The composite SLA is...",o:["Lower than 99.9%","Exactly 99.9%","Higher than 99.9%","Always 100%"],a:[0],e:"Dependencies multiply, so the combined availability is lower than either alone."},
{d:1,t:"Cloud models",q:"A company keeps its core systems in its own datacenter and uses Azure for extra capacity during busy seasons. Which model is this?",o:["Hybrid cloud","Public cloud","Private cloud","Multicloud"],a:[0],e:"Mixing on-premises systems with public cloud is a hybrid model."},
{d:1,t:"Consumption model",q:"A dev team wants to test an app quickly without buying hardware and then switch everything off. Which model suits this?",o:["Consumption-based","Capital expenditure (CapEx)","On-premises","Private cloud"],a:[0],e:"Consumption-based billing lets you start fast and stop paying when you switch resources off."},
{d:1,t:"Service types",q:"A university must run a legacy app that needs full control of the OS and installed software. Which service type fits?",o:["IaaS","PaaS","SaaS","Serverless"],a:[0],e:"IaaS gives control over the OS and what runs on it."},
{d:1,t:"Serverless",q:"A Rwandan startup wants to upload code that runs whenever a file arrives, with no servers to manage. Which approach fits?",o:["Serverless","IaaS","SaaS","On-premises"],a:[0],e:"Serverless runs event-driven code and bills per execution."},
{d:1,t:"Cloud benefits",q:"A firm must show that its cloud systems follow company rules and legal standards. Which benefit area is this?",o:["Governance","Elasticity","Predictability","Reliability"],a:[0],e:"Governance covers policy, compliance and standards."},
{d:1,t:"Service types",q:"Which of these is an example of IaaS?",o:["Azure Virtual Machines","Microsoft 365","Azure Functions","Azure App Service"],a:[0],e:"Virtual machines are rented infrastructure; you manage the OS and apps."},
{d:2,t:"Regions & zones",q:"Which feature protects VMs from the failure of an entire datacenter inside one region?",o:["Availability zones","Availability sets","Tags","Azure Backup"],a:[0],e:"Zones are physically separate datacenters; sets only spread VMs within one datacenter."},
{d:2,t:"Storage",q:"Product photos in a shop are viewed constantly. Which blob access tier fits best?",o:["Hot","Cool","Archive","Premium"],a:[0],e:"Hot is for frequently accessed data; storage costs more but access costs less."},
{d:2,t:"Storage",q:"Which option keeps copies of your data across availability zones in the primary region?",o:["Zone-redundant storage (ZRS)","Locally redundant storage (LRS)","Geo-redundant storage (GRS)","Read-access GRS"],a:[0],e:"ZRS spreads copies across zones in one region."},
{d:2,t:"Networking",q:"Which service hosts your domain name records in Azure so names resolve to IP addresses?",o:["Azure DNS","Azure Virtual Network","VPN Gateway","Azure ExpressRoute"],a:[0],e:"Azure DNS hosts DNS records and answers name queries."},
{d:2,t:"Identity",q:"Which service stores the user accounts a company uses to sign in to Azure and Microsoft 365?",o:["Microsoft Entra ID","Azure Policy","Azure Monitor","Azure Advisor"],a:[0],e:"Entra ID is the cloud directory and identity service."},
{d:2,t:"Security",q:"Which service shows a secure score and recommendations to harden your Azure workloads?",o:["Microsoft Defender for Cloud","Application Insights","Azure Cloud Shell","Azure Migrate"],a:[0],e:"Defender for Cloud measures security posture and recommends fixes. (Outline-based question.)"},

{d:3,t:"Governance",q:"You want Azure to flag or fix new resources that are missing a required tag. Which service?",o:["Azure Policy","Resource locks","Azure role-based access control (RBAC)","Azure Monitor"],a:[0],e:"Policy evaluates resource properties against your rules."},
{d:3,t:"Governance",q:"An engineer with the Owner role tries to delete a resource that has a CanNotDelete lock. What happens?",o:["Deletion is blocked until the lock is removed","The resource is deleted","The resource is archived","The lock is ignored for Owners"],a:[0],e:"Locks apply regardless of role. Remove the lock first."},

const G={"microsoft":"the provider, which owns the physical datacenter and hosts but not your data or identities.","the customer":"you, who always own your data, accounts and identities.","community":"a cloud shared by organisations with common needs.","community cloud":"a cloud shared by organisations with common needs.","single-tenant":"infrastructure dedicated to one customer.","dedicated vms":"full virtual machines that each carry their own OS.","data box":"a physical device for moving large data into Azure.","read-access grs":"geo-redundant storage that also allows reads from the secondary region.","shared responsibility":"the split of duties between provider and customer.","locks":"settings that block accidental changes or deletion.","physical hosts":"the provider's servers, managed by the provider.","datacenter power":"infrastructure the provider runs.","the datacenter team":"provider staff, who do not manage your guest OS.","azure vpn gateway":"an encrypted connection over the public internet.","azure expressroute ":"a private dedicated link.","capital expenditure (capex)":"up-front spending on physical assets such as servers.","operational expenditure (opex)":"pay-as-you-go spending on services as you use them.","consumption-based":"billing based on actual usage.","subscription":"a billing and access boundary for Azure resources.","elasticity":"automatic growth and shrinking of resources with demand.","governance":"setting rules, standards and compliance for resources.","predictability":"being able to forecast cost and performance.","sovereignty":"keeping data under a country's laws.","data sovereignty":"keeping data under a country's laws.","sustainability":"reducing environmental impact.","geo-redundancy":"keeping copies of data in another region.","load balancing":"spreading traffic across several servers.","scaling out":"adding more machines to share the load.","scaling up (vertical scaling)":"adding power to one existing machine.","reliability":"the ability to recover from failures and keep running.","high availability":"keeping workloads reachable with minimal downtime.","disaster recovery":"restoring service after a major outage.","iaas":"rented infrastructure where you manage the OS and apps.","paas":"a managed platform where you manage only the app and data.","saas":"a finished application run by the provider.","serverless":"event-driven code with no servers to manage.","on-premises":"infrastructure you own and run yourself.","public":"provider-owned infrastructure shared by many customers.","public cloud":"provider-owned infrastructure shared by many customers.","private":"a cloud used by one organisation only.","private cloud":"a cloud used by one organisation only.","hybrid":"a mix of on-premises and public cloud.","hybrid cloud":"a mix of on-premises and public cloud.","multicloud":"using more than one cloud provider.","azure policy":"a service that enforces rules on resources.","azure advisor":"a service that recommends improvements to cost, security, reliability and performance.","azure monitor":"a service that collects metrics and logs and raises alerts.","azure arc":"a service that manages on-premises and other-cloud resources from Azure.","azure service health":"a service that reports Azure incidents affecting you.","pricing calculator":"a tool that estimates costs before you deploy.","azure cloud shell":"a browser-based command line for Azure.","azure data box":"a physical device for moving large data into Azure.","azure migrate":"a service for assessing and moving workloads to Azure.","azure backup":"a service that backs up data.","azure dns":"a service that hosts domain name records.","azure virtual desktop":"a service that delivers cloud-hosted Windows desktops.","azure functions":"serverless, event-driven code.","azure app service":"a PaaS service for hosting web apps and APIs.","azure blob storage":"storage for large amounts of unstructured data.","azure queue storage":"storage for messages passed between app components.","azure files":"managed cloud file shares.","azure virtual network":"your private network inside Azure.","vpn gateway":"an encrypted connection over the public internet.","azure expressroute":"a private dedicated link that avoids the public internet.","microsoft entra id":"Azure's cloud identity and access service.","conditional access":"access rules based on conditions such as location or device.","availability zones":"separate datacenters inside one region.","availability sets":"a way to spread VMs across fault and update domains in one datacenter.","virtual machine scale sets":"a group of identical VMs that scale automatically.","scale sets":"a group of identical VMs that scale automatically.","containers":"lightweight packages that share the host OS.","azure spot vms":"cheap, interruptible VMs that use spare capacity.","reserved instances":"discounted VMs for a one- or three-year commitment.","azure reservations":"discounts for a one- or three-year commitment.","azure hybrid benefit":"a way to reuse eligible on-premises licences in Azure.","microsoft cost management":"a service for analysing spending and setting budgets.","microsoft purview":"a data governance, discovery and classification service.","microsoft defender for cloud":"a security posture and threat protection service.","azure kubernetes service":"a managed container orchestration service.","azure cli":"a cross-platform command-line tool for Azure.","azure portal":"the web-based graphical interface for Azure.","azure powershell":"a cmdlet-based tool for managing Azure.","application insights":"application performance monitoring for web apps.","region pairs":"two regions in one geography that support recovery.","management groups":"containers that organise subscriptions.","azure resource manager":"the deployment and management layer for Azure.","zero trust":"a model that verifies every request and trusts none by default.","defense in depth":"layered security so one failure does not expose everything.","hot":"the tier for frequently accessed data, with higher storage cost.","cool":"a cheaper tier for infrequently accessed data.","archive":"the cheapest tier for rarely accessed data, with slow retrieval.","premium":"a high-performance tier for low-latency workloads.","locally redundant storage (lrs)":"three copies inside a single datacenter.","zone-redundant storage (zrs)":"copies spread across availability zones.","geo-redundant storage (grs)":"copies also kept in a second region.","tags":"labels used to group resources and report costs.","tag":"a label used to group resources and report costs.","resource locks":"settings that block accidental changes or deletion.","resource lock":"a setting that blocks accidental changes or deletion.","azure role-based access control (rbac)":"role assignments that control who can do what.","virtual network peering":"a private link between two virtual networks.","single sign-on (sso)":"one sign-in for many apps.","multifactor authentication":"proof from two or more factors, such as a password plus a phone code.","azure geographies":"data-residency boundaries made of one or more regions."};
const why=x=>{const d=G[x.toLowerCase().replace(/^(a|an|the) /,"")];return d?x+": "+d+" That isn't what this scenario needs.":"This doesn't match what the question asks. Compare it with the correct answer."};

const A=document.getElementById("app");let R,T;

function go(m,d){let l;if(m=="p")l=Q.map((q,i)=>i).filter(i=>Q[i].d==d);else if(m=="w")l=Q.map((q,i)=>i).filter(i=>S[i]===0);else l=Q.map((q,i)=>i);

function show(){const i=R.l[R.i],q=Q[i],multi=q.a.length>1;R.ord=shuf(q.o.map((x,k)=>k));R.sel=[];R.chk=false;

<div class="bar" style="margin:10px 0"><i style="width:${R.i/R.l.length*100}%"></i></div><h2>${q.q}</h2>${multi?'<small>Choose '+q.a.length+'</small>':""}
<div id="fb"></div><div id="opts">${R.ord.map((k,n)=>`<button id="o${k}" onclick="pick(${k})">${"ABCD"[n]}. ${q.o[k]}</button>`).join("")}</div>
<button class="pri" id="go" onclick="check()">Check answer</button></div>`}
function pick(k){if(R.chk)return;const q=Q[R.l[R.i]];if(q.a.length>1)R.sel=R.sel.includes(k)?R.sel.filter(x=>x!=k):[...R.sel,k];else R.sel=[k];
q.o.forEach((x,j)=>document.getElementById("o"+j).classList.toggle("sel",R.sel.includes(j)))}
function check(){const i=R.l[R.i],q=Q[i];if(R.chk){R.i++;return R.i<R.l.length?show():done()}if(!R.sel.length)return;
const ok=R.sel.length==q.a.length&&q.a.every(x=>R.sel.includes(x));S[i]=ok?1:0;save();R.res.push([i,ok]);if(ok)R.ok++;
if(R.m=="m"){R.i++;return R.i<R.l.length?show():done()}
R.chk=true;q.o.forEach((x,j)=>{const b=document.getElementById("o"+j);b.classList.remove("sel");if(q.a.includes(j))b.classList.add("good");else if(R.sel.includes(j))b.classList.add("bad")});

${wr.length?`<div class="card"><h2>Review your mistakes</h2>${wr.map(x=>`<p><b>${Q[x[0]].q}</b><br><small>Answer: ${Q[x[0]].a.map(k=>Q[x[0]].o[k]).join("; ")}</small><br>${Q[x[0]].e}</p>`).join("")}</div>`:""}
